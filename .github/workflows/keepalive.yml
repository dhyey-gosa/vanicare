name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API
        run: curl -sf --max-time 90 https://vanicare-api.onrender.com/api/public/status
      - name: Wake Web
        run: curl -sf --max-time 90 -o /dev/null https://vanicare-web.onrender.com/
